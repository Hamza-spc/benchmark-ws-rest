server.port=8083
server.tomcat.threads.max=200

spring.datasource.url=jdbc:postgresql://localhost:5432/bench_rest
spring.datasource.username=hamza
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# payload "lourd" du TP : champ description non persisté (écritures 5 KB)
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=variant-d
